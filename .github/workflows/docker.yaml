name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  prepare:
    name: Prepare image list
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image matrix
        id: matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          from collections import defaultdict
          from pathlib import Path

          items = []
          for raw in Path('images.txt').read_text().splitlines():
              raw = raw.strip()
              if not raw or raw.startswith('#'):
                  continue
              args = shlex.split(raw)
              source = args[-1]
              image = source.split('@', 1)[0]
              parts = image.split('/')
              basename = parts[-1]
              namespace = parts[1] if len(parts) == 3 else (parts[0] if len(parts) == 2 else '')
              image_name = basename.split(':', 1)[0]
              platform = ''
              for index, arg in enumerate(args):
                  if arg.startswith('--platform='):
                      platform = arg.split('=', 1)[1]
                  elif arg == '--platform' and index + 1 < len(args):
                      platform = args[index + 1]
              items.append({
                  'id': len(items), 'source': source, 'pull_args': args,
                  'basename': basename, 'namespace': namespace,
                  'image_name': image_name, 'platform': platform,
              })

          namespaces = defaultdict(set)
          for item in items:
              namespaces[item['image_name']].add(item['namespace'])

          for item in items:
              prefix = item['platform'].replace('/', '_') + '_' if item['platform'] else ''
              if len(namespaces[item['image_name']]) > 1 and item['namespace']:
                  prefix += item['namespace'] + '_'
              item['target_name'] = prefix + item['basename']
              for key in ('basename', 'namespace', 'image_name', 'platform'):
                  del item[key]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('images=' + json.dumps(items, separators=(',', ':')), file=output)
          PY

  push:
    name: Push ${{ matrix.item.source }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - name: Pull and push to Aliyun
        id: transfer
        shell: bash
        env:
          ITEM_JSON: ${{ toJSON(matrix.item) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          item = json.loads(os.environ['ITEM_JSON'])
          with open('image-data.json', 'w') as f:
              json.dump(item, f)
          PY
          source=$(python3 -c 'import json; print(json.load(open("image-data.json"))["source"])')
          target_name=$(python3 -c 'import json; print(json.load(open("image-data.json"))["target_name"])')
          target="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$target_name"
          status=success
          stage=push

          if ! printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login "$ALIYUN_REGISTRY" --username "$ALIYUN_REGISTRY_USER" --password-stdin; then
            status=failed
            stage=login
          else
            mapfile -t pull_args < <(python3 -c 'import json; print("\n".join(json.load(open("image-data.json"))["pull_args"]))')
            if ! docker pull "${pull_args[@]}"; then
              status=failed
              stage=pull
            elif ! docker tag "$source" "$target"; then
              status=failed
              stage=tag
            elif ! docker push "$target"; then
              status=failed
              stage=push
            fi
          fi

          export IMAGE_STATUS="$status" IMAGE_STAGE="$stage" IMAGE_TARGET="$target"
          python3 - <<'PY'
          import json
          import os
          item = json.load(open('image-data.json'))
          result = {
              'id': item['id'], 'source': item['source'],
              'target': os.environ['IMAGE_TARGET'],
              'status': os.environ['IMAGE_STATUS'],
              'stage': os.environ['IMAGE_STAGE'],
          }
          with open(f"result-{item['id']}.json", 'w') as f:
              json.dump(result, f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              icon = '✅' if result['status'] == 'success' else '❌'
              print(f"## {icon} {result['source']}", file=f)
              print(f"Target: `{result['target']}`", file=f)
              print(f"Result: **{result['status']}** (stage: {result['stage']})", file=f)
          PY

          docker rmi "$source" "$target" || true
          [[ "$status" == success ]]

      - name: Upload image result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-result-${{ matrix.item.id }}
          path: result-*.json
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Generate summary
    needs: [prepare, push]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: push-result-*
          path: results
          merge-multiple: true
      - name: Report all images
        if: always()
        shell: bash
        env:
          IMAGE_MATRIX: ${{ needs.prepare.outputs.images }}
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          NAMESPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = json.loads(os.environ['IMAGE_MATRIX'])
          results = {}
          for path in Path('results').glob('*.json'):
              result = json.loads(path.read_text())
              results[result['id']] = result

          success = 0
          failed = 0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print('## 🐳 Docker Image Push Summary\n', file=out)
              print('| Source | Target | Result |', file=out)
              print('|---|---|---|', file=out)
              for item in expected:
                  result = results.get(item['id'])
                  if result:
                      ok = result['status'] == 'success'
                      stage = result['stage']
                      target = result['target']
                  else:
                      ok = False
                      stage = 'missing result'
                      target = f"{os.environ['REGISTRY']}/{os.environ['NAMESPACE']}/{item['target_name']}"
                  success += int(ok)
                  failed += int(not ok)
                  state = '✅ Success' if ok else f'❌ Failed ({stage})'
                  print(f"| `{item['source']}` | `{target}` | {state} |", file=out)
              print(f'\n**Total:** {len(expected)} · **Successful:** {success} · **Failed:** {failed}', file=out)

          if failed:
              raise SystemExit(1)
          PY
